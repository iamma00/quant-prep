[package]
name = "quant-org-os"
version = "0.1.0"
description = "Offline-first operating manual for quantitative trading firms"
authors = ["Quant Org OS contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/iamma00/quant-org-os"
homepage = "https://github.com/iamma00/quant-org-os"
keywords = ["quant", "trading", "organization", "career", "offline"]
categories = ["education"]

[lib]
name = "quant_org_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
