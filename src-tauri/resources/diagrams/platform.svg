<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-label="Platform architecture"><style>
        .pbox{fill:var(--diagram-box,#fff);stroke:var(--diagram-stroke,#D0D5DD);stroke-width:1.2}
        .phead{fill:var(--diagram-ink,#0F2E2E)}
        .ptitle{font-family:"Segoe UI",Arial,sans-serif;font-size:12px;font-weight:700;fill:#fff}
        .plabel{font-family:"Segoe UI",Arial,sans-serif;font-size:11px;fill:var(--diagram-ink,#0F2E2E)}
        .pcap{font-family:"Segoe UI",Arial,sans-serif;font-size:10.5px;fill:var(--diagram-muted,#667085)}
        .parrow{stroke:var(--diagram-edge,#98A2B3);stroke-width:1.5;fill:none;marker-end:url(#arrow)}
        </style>
        <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#98A2B3"/></marker></defs><rect class="phead" x="30" y="18" width="240" height="34" rx="6"/><text class="ptitle" x="42" y="40">DATA PLANE</text><rect class="pbox" x="30" y="70" width="240" height="46" rx="7"/><text class="plabel" x="42" y="98">Market data ingestion</text><rect class="pbox" x="30" y="134" width="240" height="46" rx="7"/><text class="plabel" x="42" y="162">Tick / order-book store</text><rect class="pbox" x="30" y="198" width="240" height="46" rx="7"/><text class="plabel" x="42" y="226">Reference &amp; corporate actions</text><rect class="pbox" x="30" y="262" width="240" height="46" rx="7"/><text class="plabel" x="42" y="290">Feature store</text><rect class="phead" x="330" y="18" width="240" height="34" rx="6"/><text class="ptitle" x="342" y="40">RESEARCH &amp; SIMULATION</text><rect class="pbox" x="330" y="70" width="240" height="46" rx="7"/><text class="plabel" x="342" y="98">Backtesting</text><rect class="pbox" x="330" y="134" width="240" height="46" rx="7"/><text class="plabel" x="342" y="162">Simulation / replay</text><rect class="pbox" x="330" y="198" width="240" height="46" rx="7"/><text class="plabel" x="342" y="226">ML training</text><rect class="pbox" x="330" y="262" width="240" height="46" rx="7"/><text class="plabel" x="342" y="290">Experiment tracking</text><rect class="phead" x="640" y="18" width="240" height="34" rx="6"/><text class="ptitle" x="652" y="40">EXECUTION PLANE</text><rect class="pbox" x="640" y="70" width="240" height="46" rx="7"/><text class="plabel" x="652" y="98">Order management</text><rect class="pbox" x="640" y="134" width="240" height="46" rx="7"/><text class="plabel" x="652" y="162">Execution management</text><rect class="pbox" x="640" y="198" width="240" height="46" rx="7"/><text class="plabel" x="652" y="226">Gateways / co-location</text><rect class="pbox" x="640" y="262" width="240" height="46" rx="7"/><text class="plabel" x="652" y="290">FPGA / hardware</text><rect class="phead" x="950" y="18" width="240" height="34" rx="6"/><text class="ptitle" x="962" y="40">CONTROL PLANE</text><rect class="pbox" x="950" y="70" width="240" height="46" rx="7"/><text class="plabel" x="962" y="98">Pre-trade risk</text><rect class="pbox" x="950" y="134" width="240" height="46" rx="7"/><text class="plabel" x="962" y="162">Monitoring / telemetry</text><rect class="pbox" x="950" y="198" width="240" height="46" rx="7"/><text class="plabel" x="962" y="226">Deployment / CI-CD</text><rect class="pbox" x="950" y="262" width="240" height="46" rx="7"/><text class="plabel" x="962" y="290">Identity &amp; access</text><path class="parrow" d="M270,150 C300,150 300,150 330,150"/><path class="parrow" d="M570,150 C605,150 605,150 640,150"/><path class="parrow" d="M880,150 C915,150 915,150 950,150"/><path class="parrow" d="M1070,260 C975,260 975,300 880,300"/><path class="parrow" d="M1070,300 C820,300 820,300 570,300"/><path class="parrow" d="M1070,340 C670,340 670,340 270,340"/><text class="pcap" x="30" y="600">Data flows left to right; the control plane is independent and cannot be bypassed by the execution path.</text></svg>