name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build installers
        run: npx tauri build
      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/make_portable.ps1
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist/
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build unsigned universal app
        run: npx tauri build --target universal-apple-darwin
      - name: Collect
        run: |
          mkdir -p dist
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg dist/
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Scaffold the Android project if needed
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi
      - name: Build debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          npx tauri android build --apk --debug
      - name: Collect
        run: |
          mkdir -p dist
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \;
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Quant Org OS ${{ env.RELEASE_TAG }}
          body: |
            Quant Org OS ${{ env.RELEASE_TAG }}

            - Windows: portable `.zip` (one executable, no install), `.msi` and NSIS `-setup.exe`
            - macOS: universal `.dmg` (unsigned; right-click → Open on first launch)
            - Android: installable debug-signed `.apk`
            - `SHA256SUMS.txt`: verify your download

            Content and app changes are listed in `CHANGELOG.md`. The bundled
            edition is 51 sections + 8 appendices (61 reading units), nine
            tracks, ten bands and six org diagrams. It works fully offline.
          files: |
            artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
